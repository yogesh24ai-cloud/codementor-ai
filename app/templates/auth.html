<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeMentor AI - {{ "Create account" if mode == "register" else "Log in" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1><a class="home" href="{{ url_for('pages.index') }}">CodeMentor AI</a></h1>
  </header>
  <main>
    <section class="card auth">
      <h2>{{ "Create account" if mode == "register" else "Log in" }}</h2>
      {% for message in get_flashed_messages() %}
        <p class="flash">{{ message }}</p>
      {% endfor %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email
          <input type="email" name="email" required maxlength="254" autocomplete="email">
        </label>
        <label>Password
          <input type="password" name="password" required minlength="8" maxlength="128"
                 autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}">
        </label>
        <button type="submit" class="primary">
          {{ "Create account" if mode == "register" else "Log in" }}
        </button>
      </form>
      <p class="small">
        {% if mode == "register" %}
          Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
        {% else %}
          New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
        {% endif %}
      </p>
    </section>
  </main>
</body>
</html>
